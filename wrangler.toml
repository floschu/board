# Cloudflare Pages config for self-hosting board with synced storage (Cloudflare D1).
# See CLOUDFLARE.md for the full guide.
#
# Only read by wrangler (`npm run deploy:cloudflare`, `wrangler pages dev`). It has
# no effect on the default build, GitHub Pages, or the Docker self-host path.

name = "board"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-19"

# D1 (SQLite) binding used by functions/api/data.js.
# The database_id stays a placeholder in the repo; the build fills it in from the
# D1_DATABASE_ID env var (see scripts/inject-d1-id.mjs and CLOUDFLARE.md). Set
# D1_DATABASE_ID as a Cloudflare Pages build variable, or export it before a CLI deploy.
[[d1_databases]]
binding = "DB"
database_name = "board"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
